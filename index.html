<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: on a phone the game reaches under the notch and the home bar; the HUD keeps clear of them (src/ui/phone.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installing on a phone's home screen (2026-11-24): the manifest, iOS's icon, full screen with no browser bars. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#9fc3e6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Park Laps</title>
    <style>
      /* The start screen (src/boot.ts): nothing else loads until it's clicked, a key is pressed or a controller button. Then it says Loading… until the game removes it. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        background: linear-gradient(#9fc3e6, #dce8f3 70%, #f5f8fc);
        color: #142030;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #boot.is-loading {
        cursor: progress;
      }
      #boot b {
        font-size: 40px;
        letter-spacing: 0.04em;
      }
      #boot span {
        justify-self: center;
        padding: 8px 16px;
        border-radius: 3px;
        background: #21466f;
        color: #f4f8fc;
        font-size: 16px;
        font-weight: 700;
      }
      #boot.is-loading span {
        background: none;
        color: #142030;
        font-weight: 400;
        opacity: 0.75;
      }
      /* A phone held upright (src/boot.ts adds it): turn it sideways, or play upright anyway. */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        background: #173352;
        color: #f4f8fc;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      #rotate b {
        font-size: 22px;
      }
      #rotate p {
        max-width: 22em;
        margin: 0;
        color: #a9c1dc;
        font-size: 15px;
        line-height: 1.45;
      }
      #rotate button {
        padding: 10px 18px;
        border: 0;
        border-radius: 3px;
        background: #21466f;
        color: #f4f8fc;
        font: 700 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #rotate svg {
        width: 64px;
        height: 64px;
      }
      @media (pointer: coarse) and (orientation: portrait) and (max-width: 600px) {
        #rotate:not(.is-dismissed) {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="boot"><b>Park Laps</b><span>Click or press any key or button to start</span></div>
    <noscript>This game needs JavaScript turned on.</noscript>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
