# Deploys the leaderboard and multiplayer Worker (worker/) to Cloudflare.
# Manual only: it changes the live game, so it never runs on a push. Start it
# from the repo's Actions tab ("Deploy Worker", Run workflow), which works from
# a phone. Needs two repo secrets: CLOUDFLARE_API_TOKEN (a token made from
# Cloudflare's "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
# The Worker's own secrets (the service account key, the dev code) live on
# Cloudflare and a deploy leaves them as they are.
name: Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
